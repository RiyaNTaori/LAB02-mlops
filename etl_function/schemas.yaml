# Each entry maps an uploaded file to a BigQuery table in the `staging` dataset.
# A file is routed to a table when its name starts with the table name
# (e.g. housing_listings_batch_001.json -> staging.housing_listings).

- name: housing_listings
  size: large
  format: NEWLINE_DELIMITED_JSON
  columns: []
  schema:
    - name: "listing_id"
      type: "STRING"
      mode: "REQUIRED"
    - name: "batch_id"
      type: "STRING"
      mode: "NULLABLE"
    - name: "uploaded_at"
      type: "TIMESTAMP"
      mode: "NULLABLE"
    - name: "median_income"
      type: "FLOAT64"
      mode: "NULLABLE"
    - name: "house_age"
      type: "FLOAT64"
      mode: "NULLABLE"
    - name: "avg_rooms"
      type: "FLOAT64"
      mode: "NULLABLE"
    - name: "avg_bedrooms"
      type: "FLOAT64"
      mode: "NULLABLE"
    - name: "population"
      type: "FLOAT64"
      mode: "NULLABLE"
    - name: "avg_occupancy"
      type: "FLOAT64"
      mode: "NULLABLE"
    - name: "median_house_value"
      type: "FLOAT64"
      mode: "NULLABLE"
    - name: "location"
      type: "RECORD"
      mode: "NULLABLE"
      fields:
        - name: "latitude"
          type: "FLOAT64"
          mode: "NULLABLE"
        - name: "longitude"
          type: "FLOAT64"
          mode: "NULLABLE"
        - name: "region"
          type: "STRING"
          mode: "NULLABLE"

- name: price_predictions
  size: small
  format: NEWLINE_DELIMITED_JSON
  columns: []
  schema:
    - name: "prediction_id"
      type: "STRING"
      mode: "REQUIRED"
    - name: "predicted_at"
      type: "TIMESTAMP"
      mode: "NULLABLE"
    - name: "predicted_value"
      type: "FLOAT64"
      mode: "NULLABLE"
    - name: "model_version"
      type: "STRING"
      mode: "NULLABLE"
    - name: "features"
      type: "RECORD"
      mode: "NULLABLE"
      fields:
        - name: "median_income"
          type: "FLOAT64"
          mode: "NULLABLE"
        - name: "house_age"
          type: "FLOAT64"
          mode: "NULLABLE"
        - name: "avg_rooms"
          type: "FLOAT64"
          mode: "NULLABLE"
        - name: "avg_bedrooms"
          type: "FLOAT64"
          mode: "NULLABLE"
        - name: "population"
          type: "FLOAT64"
          mode: "NULLABLE"
        - name: "avg_occupancy"
          type: "FLOAT64"
          mode: "NULLABLE"
        - name: "latitude"
          type: "FLOAT64"
          mode: "NULLABLE"
        - name: "longitude"
          type: "FLOAT64"
          mode: "NULLABLE"
